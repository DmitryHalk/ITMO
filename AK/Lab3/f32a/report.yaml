limit: 1000
memory_size: 0x1000
memory_mapped_io:
  0x80: [72, 101, 108, 108, 111, 10]
  0x84: []
reports:
  # - name: trace
  #   slice: all
  #   view: |
  #     {pc}: {instruction:next} {pc:label}
  #     {memory:0:31}
  - name: Step-by-step
    slice: ["head", 10]
    view: |
      {pc}:	{instruction:next}	{pc:label}
  - name: Result
    slice: last
    view: |
      numio[0x80]: {io:0x80:dec}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [104,101,108,108,111]
